# Opt-in after trusted certificates exist in ./tls. Do not use for an IP-only
# deployment without a certificate trusted by every browser and agent.
services:
  frontend:
    ports:
      - "443:443"
    volumes:
      - ./frontend/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/certs:ro
