services:
  postgres:
    image: postgres:15-alpine
    container_name: demon-postgres
    restart: always
    environment:
      POSTGRES_USER: demon_user
      POSTGRES_PASSWORD: demon_password
      POSTGRES_DB: downscale_demon
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demon_user -d downscale_demon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: demon-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: DockerFile
    container_name: demon-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://demon_user:demon_password@postgres:5432/downscale_demon
      - REDIS_URL=redis://redis:6379/0
      - USE_LOCALSTACK=true
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  celery_worker:
    build:
      context: ./backend
      dockerfile: DockerFile
    container_name: demon-celery
    command: celery -A scheduler worker --loglevel=info -B
    restart: always
    environment:
      - DATABASE_URL=postgresql://demon_user:demon_password@postgres:5432/downscale_demon
      - REDIS_URL=redis://redis:6379/0
      - USE_LOCALSTACK=true
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: DockerFile
    container_name: demon-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
