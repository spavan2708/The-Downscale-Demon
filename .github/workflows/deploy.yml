name: Build, Test, and Deploy - The Downscale Demon

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Docker Compose Stack
        run: docker compose up -d --build

      - name: Wait for Services to be Healthy
        run: |
          echo "Waiting for database and redis healthchecks..."
          sleep 10
          docker compose ps

      - name: Execute Backend Integration Tests
        run: docker compose exec -T backend python test_integration.py

      - name: Tear Down Test Stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to EC2 Instance
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        id: deploy_check
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USERNAME" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping EC2 deployment because one or more required secrets are missing."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip deploy when secrets are missing
        if: steps.deploy_check.outputs.ready != 'true'
        run: echo "EC2 deployment skipped."

      - name: Deploy via SSH to EC2
        if: steps.deploy_check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USERNAME }}
          key: ${{ env.EC2_SSH_KEY }}
          port: 22
          script: |
            cd /home/${{ env.EC2_USERNAME }}/The-Downscale-Demon || exit 1
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
            docker compose ps